<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nanum Market Calculator">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">
<title>Nanum Market Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --surface-sunken: #EFEDE7;
    --ink: #1B1D1B;
    --ink-soft: #5A5D58;
    --border: #E1DED5;
    --accent: #2F6F4E;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4EFE8;
    --danger: #A6412B;
    --warn: #9A6A16;
    --radius-s: 8px;
    --radius-m: 14px;
    --shadow: 0 1px 2px rgba(20, 20, 15, 0.06);
    box-sizing: border-box;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #17181A;
      --surface: #1F2123;
      --surface-sunken: #26282A;
      --ink: #EDEEEA;
      --ink-soft: #A2A6A0;
      --border: #33362F;
      --accent: #58A579;
      --accent-ink: #0E1210;
      --accent-soft: #223229;
      --danger: #D9765E;
      --warn: #D9B15E;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181A;
    --surface: #1F2123;
    --surface-sunken: #26282A;
    --ink: #EDEEEA;
    --ink-soft: #A2A6A0;
    --border: #33362F;
    --accent: #58A579;
    --accent-ink: #0E1210;
    --accent-soft: #223229;
    --danger: #D9765E;
    --warn: #D9B15E;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-feature-settings: "tnum" 1;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a, button { font-family: inherit; }

  header {
    flex: 0 0 auto;
    padding: 16px 20px 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .mode-switch {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    background: var(--surface-sunken);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-switch button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  @media (max-width: 460px) {
    .mode-switch button {
      font-size: 12px;
      padding: 6px 10px;
    }
  }
  .mode-switch button.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Calculator view ---------- */
  #view-calc {
    flex: 1 1 auto;
    min-height: 0;
    display: none;
    flex-direction: column;
    padding: 12px 14px 0;
  }
  #view-calc.active { display: flex; }

  .cat-tabs {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 12px;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .cat-tab.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .grid-area {
    flex: 1 1 auto;
    min-height: 0;
    padding-bottom: 12px;
  }
  .product-grid {
    display: grid;
    width: 100%;
    height: 100%;
    gap: 10px;
  }
  .product-card {
    position: relative;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-m);
    padding: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .product-card.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .product-card .name {
    font-size: clamp(14px, 2.4vmin, 22px);
    font-weight: 700;
    display: block;
    margin-bottom: 6px;
    line-height: 1.25;
    max-width: 100%;
  }
  .product-card .price-line {
    display: flex;
    align-items: baseline;
    gap: 7px;
    flex-wrap: wrap;
  }
  .product-card .price {
    font-size: clamp(13px, 2vmin, 18px);
    color: var(--ink-soft);
    font-weight: 500;
  }
  .product-card .price-was {
    font-size: clamp(11px, 1.6vmin, 15px);
    color: var(--ink-soft);
    text-decoration: line-through;
    opacity: 0.7;
  }
  .product-card .price-discounted {
    font-size: clamp(13px, 2vmin, 18px);
    color: var(--accent);
    font-weight: 700;
  }
  .product-card.selected .price { color: var(--accent); }
  .discount-flag {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 7px;
    border-radius: 999px;
  }
  .qty-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .qty-btn {
    width: clamp(28px, 5vmin, 40px);
    height: clamp(28px, 5vmin, 40px);
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-sunken);
    color: var(--ink);
    font-size: clamp(16px, 2.6vmin, 22px);
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .qty-btn:active { transform: scale(0.94); }
  .qty-val {
    font-size: clamp(14px, 2.4vmin, 20px);
    font-weight: 700;
    min-width: 1.6em;
    text-align: center;
  }

  .empty-note {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 30px 4px;
    text-align: center;
  }

  /* ---------- Total bar + discount ---------- */
  .total-bar {
    flex: 0 0 auto;
    padding: 12px 20px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .summary-lines {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 8px;
  }
  .summary-line {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .summary-line.discount-line { color: var(--accent); font-weight: 600; }
  .total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .total-row .label {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .total-row .count {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .count-toggle {
    cursor: pointer;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-decoration-color: var(--ink-soft);
  }
  .items-panel {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    background: var(--surface-sunken);
    margin-bottom: 8px;
  }
  .item-row-wrap {
    border-bottom: 1px solid var(--border);
  }
  .item-row-wrap:last-child { border-bottom: none; }
  .item-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    font-size: 13px;
  }
  .item-row .iname {
    flex: 1 1 auto;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-row .iqty {
    color: var(--ink-soft);
    flex: 0 0 auto;
  }
  .item-row .isub {
    color: var(--ink-soft);
    min-width: 58px;
    text-align: right;
    flex: 0 0 auto;
  }
  .item-row .isub-was {
    color: var(--ink-soft);
    text-decoration: line-through;
    opacity: 0.7;
    font-size: 12px;
    flex: 0 0 auto;
  }
  .item-row .isub-disc {
    color: var(--accent);
    font-weight: 700;
    min-width: 50px;
    text-align: right;
    flex: 0 0 auto;
  }
  .item-row .discount-tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    flex: 0 0 auto;
  }
  .total-row .amount {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .total-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
  }
  .pill-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: var(--radius-s);
    cursor: pointer;
  }
  .pill-btn.has-discount {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
  }
  .custom-item-panel {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-bottom: 10px;
    margin-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .custom-item-panel input[type="text"]:not(.price-input-inline) {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-s);
    padding: 8px 10px;
    font-size: 14px;
    flex: 1 1 120px;
    min-width: 0;
  }
  .custom-item-panel .price-field {
    flex: 0 0 auto;
  }
  .custom-item-panel .price-input-inline {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-s);
    padding: 8px 10px;
    font-size: 14px;
    width: 80px;
  }
  .custom-item-panel input:focus, .custom-item-panel select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .custom-item-panel select {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-s);
    padding: 8px 8px;
    font-size: 13px;
    flex: 0 0 auto;
    max-width: 140px;
  }
  .item-row .custom-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 999px;
    margin-left: 5px;
  }
  .mini-qty-row {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
  }
  .mini-qty-row .qty-val {
    font-size: 12px;
    font-weight: 700;
    min-width: 1.4em;
    text-align: center;
  }
  .mini-qty-btn {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    padding: 0;
  }
  .item-row .custom-remove-btn {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 4px;
    flex: 0 0 auto;
    line-height: 1;
  }

  /* ---------- Manage view + Admin view ---------- */
  #view-manage, #view-admin {
    flex: 1 1 auto;
    min-height: 0;
    display: none;
    flex-direction: column;
    overflow-y: auto;
    padding: 18px 20px 30px;
  }
  #view-manage.active, #view-admin.active { display: flex; }

  .manage-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-m);
    background: var(--surface);
  }
  .admin-lock {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 10px;
  }
  .admin-lock-card {
    width: 100%;
    max-width: 300px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-m);
    padding: 24px 22px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .admin-lock-card h2 {
    font-size: 17px;
    font-weight: 800;
    margin: 0 0 6px;
  }
  .admin-danger-zone {
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .btn-danger {
    width: 100%;
    border: 1px solid var(--danger);
    background: transparent;
    color: var(--danger);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: var(--radius-s);
    cursor: pointer;
    display: flex;
    justify-content: center;
  }
  .manage-toolbar .status {
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-soft);
    flex: 0 0 auto;
  }
  .status.dirty .status-dot { background: var(--warn); }
  .status.dirty { color: var(--warn); }
  .status.saved { color: var(--ink-soft); }
  .btn-save {
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: var(--radius-s);
    cursor: pointer;
  }
  .manage-section {
    margin-bottom: 28px;
    flex: 0 0 auto;
  }
  .manage-section h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--ink-soft);
  }
  .add-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .add-row input, .add-row select {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: var(--radius-s);
    padding: 10px 12px;
    font-size: 14px;
    flex: 1 1 120px;
    min-width: 0;
  }
  .add-row input:focus, .add-row select:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .btn-primary {
    border: none;
    background: var(--ink);
    color: var(--bg);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 16px;
    border-radius: var(--radius-s);
    cursor: pointer;
    flex: 0 0 auto;
  }
  .product-group {
    margin-bottom: 22px;
  }
  .product-group:last-child {
    margin-bottom: 0;
  }
  .product-group-header {
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--radius-m) var(--radius-m) 0 0;
    background: var(--surface-sunken);
    padding: 12px 14px;
  }
  .product-group-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 14px;
  }
  .product-group-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .product-group-header .inherit-note {
    display: block;
    margin-top: 8px;
  }
  .category-group-discount {
    flex: 0 0 auto;
  }
  .category-group-discount .price-currency {
    text-transform: none;
    letter-spacing: normal;
    font-weight: 500;
  }
  .field-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .product-list {
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius-m) var(--radius-m);
    overflow: hidden;
    background: var(--surface);
  }
  .product-list-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    flex-wrap: wrap;
  }
  .product-list-row:last-child { border-bottom: none; }
  .product-list-row .pname { font-weight: 600; flex: 1 1 100px; min-width: 90px; }
  .product-card-row {
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .product-card-row:last-child { border-bottom: none; }
  .product-card-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .product-card-row-top .pname {
    font-size: 15px;
    font-weight: 700;
  }
  .product-card-row-fields {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .product-card-row-result {
    text-align: right;
  }
  .price-field {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
  }
  .price-field .price-currency {
    color: var(--ink-soft);
    font-size: 14px;
  }
  .price-input {
    width: 76px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 7px 8px;
    font-size: 14px;
    text-align: right;
  }
  .price-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .discount-rate-field {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
  }
  .discount-rate-field .price-currency {
    color: var(--ink-soft);
    font-size: 13px;
    white-space: nowrap;
  }
  .discount-rate-input {
    width: 84px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 7px 8px;
    font-size: 14px;
    text-align: right;
  }
  .discount-rate-input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .final-price {
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
  }
  .final-price-muted {
    color: var(--ink-soft);
    font-weight: 400;
    font-style: italic;
    font-size: 12px;
  }
  .inherit-note {
    color: var(--ink-soft);
    font-weight: 400;
    font-size: 11px;
  }
  .remove-btn, .remove-cat-btn {
    border: none;
    background: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 6px;
    flex: 0 0 auto;
  }
  .hint {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 16px;
  }
  .device-notice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--warn);
    background: var(--surface-sunken);
    border-radius: var(--radius-m);
    margin-bottom: 20px;
  }
  .device-notice .device-notice-icon {
    font-size: 16px;
    line-height: 1;
    flex: 0 0 auto;
  }

    ]
  };

  var state = {
    categories: [],
    products: [],
    categoryDiscounts: {}, // category name -> % off, applies to every product in it unless the product has its own rate
    activeCategory: '',
    selections: {}, // productId -> quantity (never persisted — a fresh cart every visit)
    customCart: [], // one-off items added on the fly: { id, name, price, qty } — never persisted
    customItemPanelOpen: false,
    discount: 0, // checkout-level discount, as a plain percentage
    itemsPanelOpen: true
  };

  // The catalog baked into this specific file (see the <script
  // type="application/json" id="embedded-catalog"> tag above). Every
  // copy of this file carries whatever was embedded in it when it was
  // downloaded, so it looks the same the first time it's opened
  // anywhere — before any browser-specific edits happen.
  function getEmbeddedCatalog() {
    try {
      var tag = document.getElementById('embedded-catalog');
      if (tag) {
        var parsed = JSON.parse(tag.textContent);
        if (parsed && parsed.categories && parsed.products) return parsed;
      }
    } catch (e) {
      console.warn('Could not read the catalog embedded in this file.', e);
    }
    return null;
  }

  // Reads a discount as a plain percentage number. Also accepts a
  // { type, value } object (from a brief earlier version of this
  // page) by just taking its value and treating it as a percent.
  function readPercent(raw) {
    var v = (raw && typeof raw === 'object') ? raw.value : raw;
    return (typeof v === 'number' && v > 0) ? Math.min(100, v) : null;
  }

  // Puts a { categories, products, categoryDiscounts, discount }
  // object into effect as the app's current state. Used both for the
  // normal startup load and for the Admin "Reset to default" button.
  function applyCatalogData(data) {
    state.categories = data.categories;
    state.products = data.products.map(function (p) {
      return { id: p.id, name: p.name, price: p.price, category: p.category, discountRate: readPercent(p.discountRate || p.discount) };
    });
    state.categoryDiscounts = {};
    if (data.categoryDiscounts && typeof data.categoryDiscounts === 'object') {
      Object.keys(data.categoryDiscounts).forEach(function (cat) {
        var r = readPercent(data.categoryDiscounts[cat]);
        if (r) state.categoryDiscounts[cat] = r;
      });
    }
    state.activeCategory = data.categories[0] || '';

    // The overall discount is a standing percentage set on the Manage
    // products and discount page — it auto-saves and reloads just
    // like the catalog itself, and travels along in a downloaded copy.
    state.discount = readPercent(data.discount) || 0;
  }

  function load() {
    var data = getEmbeddedCatalog() || DEFAULT_CATALOG;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.categories && parsed.products) {
          data = parsed;
        }
      }
    } catch (e) {
      console.warn('Could not load saved data, starting fresh.', e);
    }
    applyCatalogData(data);
  }

  // Wipes whatever is saved on this device and puts the catalog baked
  // into this file (see the embedded-catalog script tag) back in
  // effect — the same starting point anyone opening a fresh copy of
  // this file would see.
  function resetToDefaultCatalog() {
    // Clear this browser's saved data first, then read the catalog
    // straight from what's built into this HTML file — not from
    // whatever was cached here before.
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      console.warn('Could not clear this browser\'s saved data.', e);
    }
    var data = getEmbeddedCatalog() || DEFAULT_CATALOG;
    applyCatalogData(data);
    state.selections = {};
    state.customCart = [];
  }

  // Auto-saves the current catalog to this browser every time it
  // changes, so a refresh or an accidental close/reopen keeps it.
  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        categories: state.categories,
        products: state.products,
        categoryDiscounts: state.categoryDiscounts,
        discount: state.discount
      }));
      showSavedPulse();
      return true;
    } catch (e) {
      console.warn('Could not save data.', e);
      showSaveError();
      return false;
    }
  }

  // Bakes the current product list — and the current overall discount,
  // if one is set — into a fresh copy of this exact file and downloads
  // it. That copy will show these products, and start with that same
  // discount already applied, the first time it's opened in any
  // browser or on any device, with no import step needed.
  function downloadCopyWithProducts() {
    try {
      // Work on a detached copy of the page — never the live document —
      // so this can't disturb what this page itself considers its
      // original defaults (which "Reset to default" relies on staying
      // untouched for as long as this page is open).
      var clone = document.documentElement.cloneNode(true);
      var cloneTag = clone.querySelector('#embedded-catalog');
      if (cloneTag) {
        cloneTag.textContent = JSON.stringify({
          categories: state.categories,
          products: state.products,
          categoryDiscounts: state.categoryDiscounts,
          discount: state.discount
        });
      }
      [['btn-calc', 'view-calc'], ['btn-manage', 'view-manage'], ['btn-admin', 'view-admin']].forEach(function (pair) {
        var btnEl = clone.querySelector('#' + pair[0]);
        var viewEl = clone.querySelector('#' + pair[1]);
        var isCalc = pair[0] === 'btn-calc';
        if (btnEl) btnEl.classList.toggle('active', isCalc);
        if (viewEl) viewEl.classList.toggle('active', isCalc);
      });
      var htmlStr = '<!DOCTYPE html>\n' + clone.outerHTML;
      var blob = new Blob([htmlStr], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'pricing-calculator.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    } catch (e) {
      console.warn('Could not prepare the download.', e);
      alert('Could not prepare the file for download in this browser.');
    }
  }

  function fmt(n) {
    return '$' + n.toFixed(2);
  }

  function uid() {
    return 'p' + Math.random().toString(36).slice(2, 9);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // ---------- Calculator view ----------
  var tabsEl = document.getElementById('cat-tabs');
  var gridAreaEl = document.getElementById('grid-area');
  var totalBarEl = document.getElementById('total-bar');

  // Picks a column/row count so the cards fill the available area as
  // evenly as possible, given how many products are in this category
  // and the shape of the space they have to fill.
  function computeGridDims(n, width, height) {
    if (n <= 0) return { cols: 1, rows: 1 };
    if (n === 1) return { cols: 1, rows: 1 };
    var ratio = (width > 0 && height > 0) ? (width / height) : 1.6;
    var cols = Math.round(Math.sqrt(n * ratio));
    cols = Math.max(1, Math.min(cols, n));
    var rows = Math.ceil(n / cols);
    while (cols > 1 && (rows * cols - n) >= rows) {
      cols -= 1;
      rows = Math.ceil(n / cols);
    }
    return { cols: cols, rows: rows };
  }

  function layoutGrid(gridEl, count) {
    if (!gridEl || count <= 0) return;
    var rect = gridAreaEl.getBoundingClientRect();
    var dims = computeGridDims(count, rect.width, rect.height);
    gridEl.style.gridTemplateColumns = 'repeat(' + dims.cols + ', 1fr)';
    gridEl.style.gridTemplateRows = 'repeat(' + dims.rows + ', 1fr)';
  }

  function relayoutCurrentGrid() {
    var gridEl = document.getElementById('product-grid');
    if (gridEl) {
      var count = gridEl.querySelectorAll('.product-card').length;
      layoutGrid(gridEl, count);
    }
  }

  function renderCalc() {
    var cats = state.categories;
    var tabsHtml = cats.map(function (c) {
      var active = c === state.activeCategory ? ' active' : '';
      return '<button class="cat-tab' + active + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
    }).join('');
    tabsEl.innerHTML = tabsHtml;

    tabsEl.querySelectorAll('.cat-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.activeCategory = btn.getAttribute('data-cat');
        renderCalc();
        // If the "+ Custom item" panel is open, its category default should
        // track whichever tab is now active, not stay on the old one.
        renderTotal();
      });
    });

    var productsInCat = state.products.filter(function (p) { return p.category === state.activeCategory; });

    if (cats.length === 0) {
      gridAreaEl.innerHTML = '<div class="empty-note">No categories yet. Add one from the "Manage products and discounts" tab.</div>';
      return;
    }
    if (productsInCat.length === 0) {
      gridAreaEl.innerHTML = '<div class="empty-note">No products in this category yet. Add one from the "Manage products and discounts" tab.</div>';
      return;
    }

    gridAreaEl.innerHTML = '<div class="product-grid" id="product-grid"></div>';
    var gridEl = document.getElementById('product-grid');

    gridEl.innerHTML = productsInCat.map(function (p) {
      var qty = state.selections[p.id] || 0;
      var selected = qty > 0;
      var rate = productDiscountRate(p);
      var hasDiscount = rate > 0;
      var priceHtml = hasDiscount
        ? '<span class="price-was">' + fmt(p.price) + '</span><span class="price-discounted">' + fmt(p.price * (1 - rate / 100)) + '</span>'
        : '<span class="price">' + fmt(p.price) + '</span>';
      return '<div class="product-card' + (selected ? ' selected' : '') + '" data-id="' + p.id + '">' +
        (hasDiscount ? '<span class="discount-flag">\u2013' + rate + '%</span>' : '') +
        '<span class="name">' + escapeHtml(p.name) + '</span>' +
        '<span class="price-line">' + priceHtml + '</span>' +
        '<div class="qty-row">' +
          '<button class="qty-btn" data-action="dec" data-id="' + p.id + '" aria-label="Decrease quantity">–</button>' +
          '<span class="qty-val">' + qty + '</span>' +
          '<button class="qty-btn" data-action="inc" data-id="' + p.id + '" aria-label="Increase quantity">+</button>' +
        '</div>' +
      '</div>';
    }).join('');

    gridEl.querySelectorAll('.qty-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var action = btn.getAttribute('data-action');
        var current = state.selections[id] || 0;
        if (action === 'inc') current += 1;
        if (action === 'dec') current = Math.max(0, current - 1);
        state.selections[id] = current;
        renderCalc();
        renderTotal();
      });
    });

    layoutGrid(gridEl, productsInCat.length);
  }

  // Every discount in this app is a plain percentage. How much a
  // percent discount takes off a given base amount.
  function computeDiscountAmount(percent, base) {
    if (!(percent > 0) || !(base > 0)) return 0;
    var pct = Math.min(100, Math.max(0, percent));
    return base * (pct / 100);
  }

  // A category's own discount rate (set in Manage products), clamped
  // to a sane 0–100 range. 0 means the category has no discount.
  function categoryDiscountRate(cat) {
    var r = state.categoryDiscounts[cat];
    if (typeof r !== 'number' || isNaN(r) || r <= 0) return 0;
    return Math.min(100, r);
  }

  // The discount rate that actually applies to a product: its own
  // rate if one is set, otherwise its category's rate, otherwise 0.
  // A product-specific rate always wins over the category's.
  function productDiscountRate(product) {
    var own = product.discountRate;
    if (typeof own === 'number' && !isNaN(own) && own > 0) {
      return Math.min(100, own);
    }
    return categoryDiscountRate(product.category);
  }

  // Subtotal, the per-product line items behind it (each already net
  // of whichever discount rate applies to it, if any), the
  // checkout-level discount amount that applies on top, and the total.
  function computeTotals() {
    var subtotal = 0;
    var count = 0;
    var lineItems = [];
    // Walk the catalog (not the selections object) so items list in a
    // stable, familiar order rather than object-key order.
    state.products.forEach(function (product) {
      var qty = state.selections[product.id] || 0;
      if (qty > 0) {
        var rate = productDiscountRate(product);
        var baseLineSubtotal = product.price * qty;
        var itemDiscountAmount = baseLineSubtotal * (rate / 100);
        var lineSubtotal = Math.max(0, baseLineSubtotal - itemDiscountAmount);
        subtotal += lineSubtotal;
        count += qty;
        lineItems.push({
          id: product.id,
          name: product.name,
          qty: qty,
          unitPrice: product.price,
          discountRate: rate,
          baseLineSubtotal: baseLineSubtotal,
          itemDiscountAmount: itemDiscountAmount,
          lineSubtotal: lineSubtotal,
          isCustom: false
        });
      }
    });
    // One-off custom items added straight from the Calculator. They
    // have no rate of their own, but if one was assigned a category
    // when it was added, that category's discount still applies.
    state.customCart.forEach(function (item) {
      var rate = item.category ? categoryDiscountRate(item.category) : 0;
      var baseLineSubtotal = item.price * item.qty;
      var itemDiscountAmount = baseLineSubtotal * (rate / 100);
      var lineSubtotal = Math.max(0, baseLineSubtotal - itemDiscountAmount);
      subtotal += lineSubtotal;
      count += item.qty;
      lineItems.push({
        id: item.id,
        name: item.name,
        qty: item.qty,
        unitPrice: item.price,
        category: item.category || '',
        discountRate: rate,
        baseLineSubtotal: baseLineSubtotal,
        itemDiscountAmount: itemDiscountAmount,
        lineSubtotal: lineSubtotal,
        isCustom: true
      });
    });
    var discountAmount = computeDiscountAmount(state.discount, subtotal);
    var total = Math.max(0, subtotal - discountAmount);
    return { subtotal: subtotal, discountAmount: discountAmount, total: total, count: count, lineItems: lineItems };
  }

  function renderTotal() {
    var t = computeTotals();
    var hasDiscount = state.discount > 0 && t.discountAmount > 0;

    var itemsPanelHtml = '';
    if (state.itemsPanelOpen && t.lineItems.length > 0) {
      itemsPanelHtml =
        '<div class="items-panel">' +
          t.lineItems.map(function (item) {
            var hasItemDiscount = item.itemDiscountAmount > 0;
            var priceHtml = hasItemDiscount
              ? '<span class="isub-was">' + fmt(item.baseLineSubtotal) + '</span><span class="isub-disc">' + fmt(item.lineSubtotal) + '</span>'
              : '<span class="isub">' + fmt(item.lineSubtotal) + '</span>';
            var qtyHtml = item.isCustom
              ? '<div class="mini-qty-row">' +
                  '<button class="mini-qty-btn" data-action="dec" data-cid="' + item.id + '" aria-label="Decrease quantity">\u2013</button>' +
                  '<span class="qty-val">' + item.qty + '</span>' +
                  '<button class="mini-qty-btn" data-action="inc" data-cid="' + item.id + '" aria-label="Increase quantity">+</button>' +
                '</div>'
              : '<span class="iqty">\u00d7' + item.qty + '</span>';
            return '<div class="item-row-wrap">' +
              '<div class="item-row">' +
                '<span class="iname">' + escapeHtml(item.name) + (item.isCustom ? '<span class="custom-tag">custom</span>' : '') + '</span>' +
                (hasItemDiscount ? '<span class="discount-tag">\u2013' + item.discountRate + '%</span>' : '') +
                qtyHtml +
                priceHtml +
                (item.isCustom ? '<button class="custom-remove-btn" data-cid="' + item.id + '" title="Remove">\u00d7</button>' : '') +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    var summaryHtml = '';
    if (hasDiscount) {
      var discountLabel = '\u2013' + state.discount + '%';
      summaryHtml =
        '<div class="summary-lines">' +
          '<div class="summary-line"><span>Subtotal</span><span>' + fmt(t.subtotal) + '</span></div>' +
          '<div class="summary-line discount-line"><span>Discount (' + discountLabel + ')</span><span>\u2013' + fmt(t.discountAmount) + '</span></div>' +
        '</div>';
    }

    var customPanelHtml = '';
    if (state.customItemPanelOpen) {
      var customCatOptionsHtml = state.categories.map(function (c) {
        return '<option value="' + escapeHtml(c) + '"' + (c === state.activeCategory ? ' selected' : '') + '>' + escapeHtml(c) + '</option>';
      }).join('') + '<option value=""' + (state.activeCategory ? '' : ' selected') + '>No category</option>';
      customPanelHtml =
        '<div class="custom-item-panel">' +
          '<div class="price-field"><span class="price-currency">$</span><input type="text" inputmode="decimal" class="price-input-inline" id="custom-item-price" placeholder="Price"></div>' +
          (state.categories.length > 0
            ? '<select id="custom-item-cat" title="The item will be named after this category and use its discount">' + customCatOptionsHtml + '</select>'
            : '') +
          '<button class="btn-primary" id="custom-item-add-btn">Add to cart</button>' +
        '</div>';
    }

    var canToggleItems = t.lineItems.length > 0;
    var countLabel = t.count + (t.count === 1 ? ' item selected' : ' items selected');
    if (canToggleItems) countLabel += (state.itemsPanelOpen ? ' \u25b2' : ' \u25bc');

    totalBarEl.innerHTML =
      customPanelHtml +
      itemsPanelHtml +
      summaryHtml +
      '<div class="total-row">' +
        '<div>' +
          '<div class="label">Total</div>' +
          '<div class="count' + (canToggleItems ? ' count-toggle' : '') + '" id="items-toggle">' + countLabel + '</div>' +
        '</div>' +
        '<div class="total-actions">' +
          '<button class="pill-btn' + (state.customItemPanelOpen ? ' has-discount' : '') + '" id="custom-item-toggle-btn">+ Custom item</button>' +
          '<button class="pill-btn" id="clear-btn">Clear cart</button>' +
          '<div class="amount">' + fmt(t.total) + '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('custom-item-toggle-btn').addEventListener('click', function () {
      state.customItemPanelOpen = !state.customItemPanelOpen;
      renderTotal();
      relayoutCurrentGrid();
    });

    if (canToggleItems) {
      document.getElementById('items-toggle').addEventListener('click', function () {
        state.itemsPanelOpen = !state.itemsPanelOpen;
        renderTotal();
        relayoutCurrentGrid();
      });
    }

    document.getElementById('clear-btn').addEventListener('click', function () {
      state.selections = {};
      state.customCart = [];
      renderCalc();
      renderTotal();
    });

    // Quantity +/- and remove for one-off custom items in the items list.
    totalBarEl.querySelectorAll('.mini-qty-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var cid = btn.getAttribute('data-cid');
        var action = btn.getAttribute('data-action');
        var entry = state.customCart.filter(function (c) { return c.id === cid; })[0];
        if (!entry) return;
        if (action === 'inc') entry.qty += 1;
        if (action === 'dec') entry.qty -= 1;
        if (entry.qty <= 0) {
          state.customCart = state.customCart.filter(function (c) { return c.id !== cid; });
        }
        renderTotal();
        relayoutCurrentGrid();
      });
    });

    totalBarEl.querySelectorAll('.custom-remove-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var cid = btn.getAttribute('data-cid');
        state.customCart = state.customCart.filter(function (c) { return c.id !== cid; });
        renderTotal();
        relayoutCurrentGrid();
      });
    });

    if (state.customItemPanelOpen) {
      var customPriceInput = document.getElementById('custom-item-price');

      customPriceInput.addEventListener('input', function () {
        var cleaned = customPriceInput.value.replace(/[^0-9.]/g, '');
        var firstDot = cleaned.indexOf('.');
        if (firstDot !== -1) {
          cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
        }
        if (cleaned !== customPriceInput.value) customPriceInput.value = cleaned;
      });

      function addCustomItem() {
        var v = parseFloat(customPriceInput.value);
        if (isNaN(v) || v < 0) {
          customPriceInput.focus();
          return;
        }
        var catSelect = document.getElementById('custom-item-cat');
        var category = catSelect ? catSelect.value : '';
        var name = category || 'Custom item';
        state.customCart.push({ id: uid(), name: name, price: v, qty: 1, category: category });
        customPriceInput.value = '';
        state.itemsPanelOpen = true;
        renderTotal();
        relayoutCurrentGrid();
        // Keep the panel open and ready for another quick entry.
        var freshPriceInput = document.getElementById('custom-item-price');
        if (freshPriceInput) freshPriceInput.focus();
      }

      document.getElementById('custom-item-add-btn').addEventListener('click', addCustomItem);
      customPriceInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addCustomItem();
      });
    }

    relayoutCurrentGrid();
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(relayoutCurrentGrid, 120);
  });

  // ---------- Manage view (open — no password) ----------
  var manageEl = document.getElementById('view-manage');

  function showSavedPulse() {
    var statusEl = document.getElementById('manage-status');
    if (!statusEl) return;
    statusEl.className = 'status saved';
    statusEl.innerHTML = '<span class="status-dot"></span>Saved on this device';
  }

  function showSaveError() {
    var statusEl = document.getElementById('manage-status');
    if (!statusEl) return;
    statusEl.className = 'status dirty';
    statusEl.innerHTML = '<span class="status-dot"></span>Could not save — try again';
  }

  function renderManage() {
    var catRowsHtml = state.categories.length > 0
      ? state.categories.map(function (cat) {
          return '<div class="product-list-row">' +
            '<span class="pname">' + escapeHtml(cat) + '</span>' +
            '<button class="remove-cat-btn" data-cat="' + escapeHtml(cat) + '">Remove</button>' +
            '</div>';
        }).join('')
      : '<div class="product-list-row"><span class="pname" style="font-weight:400; color:var(--ink-soft);">No categories yet.</span></div>';

    var catOptions = state.categories.map(function (c) {
      return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>';
    }).join('');

    // Group products under their category, in the same order the
    // category list appears, so the list mirrors how the calculator
    // itself is organized.
    var productGroupsHtml = state.categories.map(function (cat) {
      var productsInCat = state.products.filter(function (p) { return p.category === cat; });
      var catRate = categoryDiscountRate(cat);
      var rowsHtml = productsInCat.length > 0
        ? productsInCat.map(function (p) {
            var ownRate = (typeof p.discountRate === 'number' && p.discountRate > 0) ? p.discountRate : null;
            var rateVal = ownRate != null ? ownRate : '';
            var ratePlaceholder = catRate > 0 ? ('cat: ' + catRate) : '0';
            return '<div class="product-card-row">' +
              '<div class="product-card-row-top">' +
                '<span class="pname">' + escapeHtml(p.name) + '</span>' +
                '<button class="remove-btn" data-id="' + p.id + '">Remove</button>' +
              '</div>' +
              '<div class="product-card-row-fields">' +
                '<div class="field-stack">' +
                  '<span class="field-label">Price</span>' +
                  '<div class="price-field"><span class="price-currency">$</span><input type="text" inputmode="decimal" class="price-input" data-id="' + p.id + '" value="' + p.price.toFixed(2) + '"></div>' +
                '</div>' +
                '<div class="field-stack">' +
                  '<span class="field-label">Discount</span>' +
                  '<div class="discount-rate-field"><input type="text" inputmode="decimal" class="discount-rate-input" placeholder="' + ratePlaceholder + '" data-id="' + p.id + '" value="' + rateVal + '"><span class="price-currency">% off</span></div>' +
                '</div>' +
              '</div>' +
              '<div class="product-card-row-result">' + finalPriceMarkup(p) + '</div>' +
              '</div>';
          }).join('')
        : '<div class="product-card-row"><span class="pname" style="font-weight:400; color:var(--ink-soft);">No products in this category yet.</span></div>';
      var catRateVal = catRate > 0 ? catRate : '';
      var catNote = catRate > 0 ? '<span class="inherit-note">Applies to every product below unless it has its own rate.</span>' : '';
      return '<div class="product-group">' +
        '<div class="product-group-header">' +
          '<div class="product-group-header-row">' +
            '<span class="product-group-name">' + escapeHtml(cat) + '</span>' +
            '<div class="field-stack">' +
              '<span class="field-label">Category discount</span>' +
              '<div class="discount-rate-field category-group-discount"><input type="text" inputmode="decimal" class="category-discount-input" placeholder="0" data-cat="' + escapeHtml(cat) + '" value="' + catRateVal + '"><span class="price-currency">% off</span></div>' +
            '</div>' +
          '</div>' +
          catNote +
        '</div>' +
        '<div class="product-list">' + rowsHtml + '</div>' +
      '</div>';
    }).join('');

    var overallDiscountValueHtml =
      '<div class="discount-rate-field">' +
        '<input type="text" inputmode="decimal" id="overall-discount-value" placeholder="0" value="' + (state.discount > 0 ? state.discount : '') + '">' +
        '<span class="price-currency">% off</span>' +
      '</div>';

    manageEl.innerHTML =
      '<div class="device-notice">' +
        '<span class="device-notice-icon">\u26a0\ufe0f</span>' +
        '<p>Changes you make here (products, prices, categories) are saved only on this phone or computer, in this web browser. If someone opens this page on a different device or browser, they won\'t see your changes — and won\'t know about theirs either. There\'s no shared, central list.</p>' +
      '</div>' +
      '<div class="manage-section">' +
        '<h2>Overall discount</h2>' +
        '<p class="hint">Applies to the whole order total in the Calculator, on top of any category or item discounts. Leave it blank for no standing discount.</p>' +
        overallDiscountValueHtml +
      '</div>' +
      '<div class="manage-section">' +
        '<h2>Categories</h2>' +
        '<p class="hint">Categories group your products. The calculator shows one category at a time. Set a category-wide discount from the Products section below, next to each category\'s name.</p>' +
        '<div class="product-list">' + catRowsHtml + '</div>' +
        '<div class="add-row" style="margin-top:14px;">' +
          '<input type="text" id="new-cat-name" placeholder="New category name">' +
          '<button class="btn-primary" id="add-cat-btn">Add category</button>' +
        '</div>' +
      '</div>' +
      '<div class="manage-section">' +
        '<h2>Products</h2>' +
        '<div class="add-row">' +
          '<input type="text" id="new-prod-name" placeholder="Product name">' +
          '<input type="number" id="new-prod-price" placeholder="Price" step="0.01" min="0" style="flex:0 0 90px;">' +
          '<select id="new-prod-cat">' + catOptions + '</select>' +
          '<button class="btn-primary" id="add-prod-btn">Add product</button>' +
        '</div>' +
        (productGroupsHtml || '<p class="hint" style="margin:0;">Add a category above first — products will show up here grouped by category.</p>') +
      '</div>';

    var overallDiscountInput = document.getElementById('overall-discount-value');
    if (overallDiscountInput) {
      function applyOverallDiscount() {
        var raw = overallDiscountInput.value.trim();
        if (raw === '') {
          state.discount = 0;
        } else {
          var v = parseFloat(raw);
          if (isNaN(v) || v < 0) {
            overallDiscountInput.value = state.discount > 0 ? state.discount : ''; // revert on bad input
            return;
          }
          state.discount = Math.min(100, v);
        }
        persist();
        renderManage();
        renderTotal();
      }
      overallDiscountInput.addEventListener('input', function () {
        var cleaned = overallDiscountInput.value.replace(/[^0-9.]/g, '');
        var firstDot = cleaned.indexOf('.');
        if (firstDot !== -1) {
          cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
        }
        if (cleaned !== overallDiscountInput.value) overallDiscountInput.value = cleaned;
      });
      overallDiscountInput.addEventListener('blur', applyOverallDiscount);
      overallDiscountInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { applyOverallDiscount(); overallDiscountInput.blur(); }
      });
    }

    manageEl.querySelectorAll('.remove-cat-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var cat = btn.getAttribute('data-cat');
        state.categories = state.categories.filter(function (c) { return c !== cat; });
        state.products = state.products.filter(function (p) { return p.category !== cat; });
        delete state.categoryDiscounts[cat];
        if (state.activeCategory === cat) {
          state.activeCategory = state.categories[0] || '';
        }
        persist();
        renderManage();
        renderCalc();
        renderTotal();
      });
    });

    manageEl.querySelectorAll('.category-discount-input').forEach(function (input) {
      function applyCategoryRate() {
        var cat = input.getAttribute('data-cat');
        var raw = input.value.trim();
        if (raw === '') {
          delete state.categoryDiscounts[cat];
        } else {
          var v = parseFloat(raw);
          if (isNaN(v) || v < 0) {
            input.value = categoryDiscountRate(cat) > 0 ? categoryDiscountRate(cat) : ''; // revert on bad input
            return;
          }
          state.categoryDiscounts[cat] = Math.min(100, v);
        }
        persist();
        // A category rate can change the effective discount on every
        // product in it that has no rate of its own, so refresh the
        // whole page rather than trying to patch individual rows.
        renderManage();
        renderCalc();
        renderTotal();
      }
      input.addEventListener('input', function () {
        var cleaned = input.value.replace(/[^0-9.]/g, '');
        var firstDot = cleaned.indexOf('.');
        if (firstDot !== -1) {
          cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
        }
        if (cleaned !== input.value) input.value = cleaned;
      });
      input.addEventListener('blur', applyCategoryRate);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { applyCategoryRate(); input.blur(); }
      });
    });

    manageEl.querySelectorAll('button.remove-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        state.products = state.products.filter(function (p) { return p.id !== id; });
        delete state.selections[id];
        persist();
        renderManage();
        renderCalc();
        renderTotal();
      });
    });

    // Updates just the "→ $X.XX" display in a product row after its
    // price or discount rate changes, without re-rendering the whole
    // Manage products page (which would disrupt whatever else the
    // person is doing on the page).
    function finalPriceMarkup(product) {
      var ownRate = (typeof product.discountRate === 'number' && product.discountRate > 0) ? product.discountRate : null;
      var rate = productDiscountRate(product);
      if (rate <= 0) {
        return '<span class="final-price final-price-muted">No discount</span>';
      }
      var inherited = ownRate == null; // no rate of its own — this came from the category
      return '<span class="final-price">\u2192 ' + fmt(product.price * (1 - rate / 100)) +
        (inherited ? ' <span class="inherit-note">(category)</span>' : '') +
        '</span>';
    }

    function refreshRowFinalPrice(inputEl, product) {
      var row = inputEl.closest('.product-card-row');
      var span = row && row.querySelector('.final-price');
      if (!span) return;
      span.outerHTML = finalPriceMarkup(product);
    }

    manageEl.querySelectorAll('.price-input').forEach(function (input) {
      function applyPrice() {
        var id = input.getAttribute('data-id');
        var product = state.products.filter(function (p) { return p.id === id; })[0];
        if (!product) return;
        var v = parseFloat(input.value);
        if (isNaN(v) || v < 0) {
          input.value = product.price.toFixed(2); // revert on bad input
          return;
        }
        if (v === product.price) {
          input.value = product.price.toFixed(2);
          return;
        }
        product.price = v;
        persist();
        input.value = product.price.toFixed(2);
        refreshRowFinalPrice(input, product);
        renderCalc();
        renderTotal();
      }
      input.addEventListener('input', function () {
        var cleaned = input.value.replace(/[^0-9.]/g, '');
        var firstDot = cleaned.indexOf('.');
        if (firstDot !== -1) {
          cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
        }
        if (cleaned !== input.value) input.value = cleaned;
      });
      input.addEventListener('blur', applyPrice);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { applyPrice(); input.blur(); }
      });
    });

    manageEl.querySelectorAll('.discount-rate-input').forEach(function (input) {
      function applyRate() {
        var id = input.getAttribute('data-id');
        var product = state.products.filter(function (p) { return p.id === id; })[0];
        if (!product) return;
        var raw = input.value.trim();
        if (raw === '') {
          product.discountRate = null;
        } else {
          var v = parseFloat(raw);
          if (isNaN(v) || v < 0) {
            input.value = (product.discountRate > 0) ? product.discountRate : ''; // revert on bad input
            return;
          }
          product.discountRate = Math.min(100, v);
          input.value = product.discountRate;
        }
        persist();
        refreshRowFinalPrice(input, product);
        renderCalc();
        renderTotal();
      }
      input.addEventListener('input', function () {
        var cleaned = input.value.replace(/[^0-9.]/g, '');
        var firstDot = cleaned.indexOf('.');
        if (firstDot !== -1) {
          cleaned = cleaned.slice(0, firstDot + 1) + cleaned.slice(firstDot + 1).replace(/\./g, '');
        }
        if (cleaned !== input.value) input.value = cleaned;
      });
      input.addEventListener('blur', applyRate);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { applyRate(); input.blur(); }
      });
    });

    document.getElementById('add-cat-btn').addEventListener('click', function () {
      var input = document.getElementById('new-cat-name');
      var name = input.value.trim();
      if (!name) return;
      if (state.categories.indexOf(name) === -1) {
        state.categories.push(name);
        if (!state.activeCategory) state.activeCategory = name;
        persist();
        renderManage();
        renderCalc();
      }
      input.value = '';
    });

    document.getElementById('new-cat-name').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('add-cat-btn').click();
    });

    document.getElementById('add-prod-btn').addEventListener('click', function () {
      var nameInput = document.getElementById('new-prod-name');
      var priceInput = document.getElementById('new-prod-price');
      var catSelect = document.getElementById('new-prod-cat');
      var name = nameInput.value.trim();
      var price = parseFloat(priceInput.value);
      var category = catSelect ? catSelect.value : '';
      if (!name || isNaN(price) || price < 0 || !category) return;
      state.products.push({ id: uid(), name: name, price: price, category: category, discountRate: null });
      persist();
      nameInput.value = '';
      priceInput.value = '';
      renderManage();
      renderCalc();
    });

    document.getElementById('new-prod-name').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') document.getElementById('add-prod-btn').click();
    });
  }

  // ---------- Admin view (open — no password) ----------
  var adminEl = document.getElementById('view-admin');

  function renderAdmin() {
    adminEl.innerHTML =
      '<div class="admin-lock">' +
        '<div class="admin-lock-card" style="text-align:left;">' +
          '<h2 style="text-align:center; margin-bottom:14px;">Admin</h2>' +
          '<p class="hint">Saves today\'s product list — and the overall discount, if one is set — as a new copy of this file. Useful for moving it to another device or keeping a backup.</p>' +
          '<button class="btn-save" id="download-btn" style="width:100%; display:flex; justify-content:center; margin-bottom:18px;">Download copy with these products</button>' +
          '<div class="admin-danger-zone">' +
            '<p class="hint" style="margin-bottom:10px;">Erases everything saved on this device — categories, products, prices, and discounts — and puts back the original list built into this file.</p>' +
            '<button class="btn-danger" id="reset-default-btn">Refresh Product List</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('download-btn').addEventListener('click', downloadCopyWithProducts);

    document.getElementById('reset-default-btn').addEventListener('click', function () {
      var ok = window.confirm('Reset the product list to the default that\'s built into this file? This erases everything saved on this device — categories, products, prices, and discounts — and cannot be undone.');
      if (!ok) return;
      resetToDefaultCatalog();
      renderAdmin();
      renderManage();
      renderCalc();
      renderTotal();
    });
  }

  // ---------- Mode switching ----------
  var btnCalc = document.getElementById('btn-calc');
  var btnManage = document.getElementById('btn-manage');
  var btnAdmin = document.getElementById('btn-admin');
  var viewCalc = document.getElementById('view-calc');
  var viewManage = document.getElementById('view-manage');
  var viewAdmin = document.getElementById('view-admin');

  var tabButtons = [btnCalc, btnManage, btnAdmin];
  var tabViews = [viewCalc, viewManage, viewAdmin];

  function activateTab(index) {
    tabButtons.forEach(function (b, i) { b.classList.toggle('active', i === index); });
    tabViews.forEach(function (v, i) { v.classList.toggle('active', i === index); });
  }

  btnCalc.addEventListener('click', function () {
    activateTab(0);
    renderCalc();
    renderTotal();
  });

  btnManage.addEventListener('click', function () {
    activateTab(1);
    renderManage();
  });

  btnAdmin.addEventListener('click', function () {
    activateTab(2);
    renderAdmin();
  });

  load();
  renderCalc();
  renderTotal();
})();
</script>

</body>
</html>
